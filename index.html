<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tmrmn.com equals Dennis Timmermann</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"

    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <style>
      * {
        padding: 0;
        margin: 0;
      }

      body,
      html {
        height: 100%;
        background-color: #fff;
      }

      body {
        font-family: "Libre Caslon Text", serif;
        /*font-family: 'Source Sans Pro', sans-serif;*/
        font-size: 1.5rem;
        color: #fff;

      }
      .logo {
        width: 64px;
        margin: 50px;
        /*border-bottom: 2px solid #1b1b1b*/
      }
      .bg {
        background: url("src/bg.jpg");
        -webkit-background-size: cover;
        -o-background-size: cover;
        background-size: cover;
        background-position: center center;
        background-color: rgba(0, 0, 0, 0.85); /* darkness level */
        background-blend-mode: multiply; /* darkens the image */

      }
      .splash {
        width: 100%;
        /*min-height: 100%;*/
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: "Libre Caslon Text", serif;
      }
